<!DOCTYPE html>
<html>
    <head>
        <style>
            .container{
                display: grid;
                grid-template-columns:80px 100px auto;
                background-color: rgb(184, 51, 11);
                padding: 10px;
                font-size:30px;
                text-align:center;
            }
            .container div{
                background-color: #f1f1f1;
                border: 5px solid black;
                padding:20px;
                font-size:30px;
                text-align:center;
                
            }
            .container1 div{
                background-color: #a75509b7;
                border: 5px solid black;
                padding:20px;
                font-size:30px;
                text-align:center;
            }
            .container{
                display: grid;
                row-gap: 5px;;
            }
            .container1{
                display: grid;
                row-gap: 5px;
                column-gap: 5px;
            }
        </style>
    </head>
    <body>
        <h1>Grid Layout</h1>
        <p>A grid layout with 7 container</p>
        <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        </div>
        <h1>A grid with 4 container</h1>
        <div class="container1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        </div>
    </body>
</html>
